{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Log in</h1>
    <form method="post">
        <label>
            Email
            <input type="email" name="email" required autofocus>
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Log in</button>
    </form>
</div>
{% endblock %}
