{% extends "base.html" %}
{% block title %}Edit deal{% endblock %}
{% block content %}
<div class="card">
    <h1>Edit deal</h1>
    <form method="post" class="form-grid">
        <label>
            Client / deal name
            <input type="text" name="client_name" value="{{ (form.client_name if form else deal.client_name) or '' }}" required autofocus>
        </label>
        <label>
            Salesforce link or ID
            <input type="text" name="salesforce_ref" value="{{ (form.salesforce_ref if form else deal.salesforce_ref) or '' }}" placeholder="https://... or opportunity ID">
        </label>
        <label>
            Target submission date to client
            <input type="date" name="target_submission_date" value="{{ (form.target_submission_date if form else deal.target_submission_date) or '' }}" required>
        </label>
        <label>
            TCV (USD)
            <input type="number" name="tcv_usd" value="{{ (form.tcv_usd if form else deal.tcv_usd) or '' }}" min="0" step="0.01" placeholder="150000" required>
        </label>
        <label class="full-width">
            Notes
            <textarea name="notes" rows="3">{{ (form.notes if form else deal.notes) or '' }}</textarea>
        </label>
        <button type="submit">Save changes</button>
    </form>
</div>

<p><a href="{{ url_for('dashboard') }}">&larr; Back to workload dashboard</a></p>
{% endblock %}
